name: OmniDesk Universal Cross-Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-and-backend:
    name: Web UI, Schemas & Python Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck & Build Desktop Web Bundle
        run: |
          pnpm typecheck
          pnpm build:web

      - name: Run Schema & UI Tests
        run: |
          pnpm test:schemas
          pnpm test:web

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install & Test Python Engine
        working-directory: backend
        run: |
          uv sync --extra dev
          PYTHONPATH=. uv run pytest tests -v

  desktop-universal-bundles:
    name: Native Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundles: dmg,app
          - label: macOS Apple Silicon arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundles: dmg,app
          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: Windows ARM64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundles: msi,nsis
          - label: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tauri & AT-SPI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libatspi2.0-dev rpm

      - name: Install frontend dependencies & build web dist
        run: |
          pnpm install
          pnpm build:web

      - name: Build bundled Python backend sidecar (zero Python prerequisite for end users)
        run: |
          uv sync --directory backend --extra bundle
          backend/.venv/bin/python scripts/build-sidecar.py --target ${{ matrix.rust_target }}
        if: runner.os != 'Windows'

      - name: Build bundled Python backend sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --directory backend --extra bundle
          backend\.venv\Scripts\python.exe scripts/build-sidecar.py --target ${{ matrix.rust_target }}

      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build native installer bundles (${{ matrix.bundles }})
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnidesk-${{ matrix.rust_target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
