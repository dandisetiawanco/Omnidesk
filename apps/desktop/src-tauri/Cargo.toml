[package]
name = "omnidesk"
version = "0.1.0"
description = "OmniDesk: Universal AI Computer Operator"
authors = ["NGOPREK DIGITAL"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "omnidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
keyring = "3"
rand = "0.8"
window-vibrancy = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
