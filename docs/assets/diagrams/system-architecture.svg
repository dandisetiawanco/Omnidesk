<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
  <title id="title">OmniDesk System Architecture</title>
  <desc id="desc">Layered architecture connecting the Tauri 2 Rust native shell, React Omni Glass UI, authenticated loopback IPC, Python local operator engine, and local or cloud AI providers.</desc>
  <defs>
    <style>
      .bg { fill: #0E1116; stroke: #303A4A; stroke-width: 1.5; }
      .layer { fill: #161B22; stroke: #303A4A; stroke-width: 1.25; }
      .sub { fill: #1C2330; stroke: #3A4659; stroke-width: 1; }
      .accent-box { fill: #132238; stroke: #3B82F6; stroke-width: 1.25; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #F0F4F8; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9BA7B8; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 650; fill: #F0F4F8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9BA7B8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #6CB6FF; }
      .badge-ok { fill: #122E24; stroke: #2F855A; stroke-width: 1; }
      .badge-ok-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #4CD98D; }
      .arrow { stroke: #6CB6FF; stroke-width: 1.75; fill: none; }
      .arrow-muted { stroke: #68768A; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6CB6FF" />
    </marker>
    <marker id="ah-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#68768A" />
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="558" rx="14" class="bg" />
  <text x="32" y="38" class="title">OmniDesk System Architecture</text>
  <text x="32" y="56" class="subtitle">Isolated native desktop shell, authenticated loopback engine, local SQLite state, and optional AI inference layers</text>

  <!-- Layer 1: Native Desktop Shell -->
  <rect x="32" y="78" width="1056" height="106" rx="10" class="layer" />
  <text x="48" y="102" class="heading">1. Native Desktop Shell | Tauri 2 (Rust)</text>
  <text x="48" y="118" class="mono">apps/desktop/src-tauri</text>
  <rect x="860" y="88" width="210" height="22" rx="6" class="badge-ok" />
  <text x="965" y="103" text-anchor="middle" class="badge-ok-t">256-bit CSPRNG Session Token</text>

  <rect x="48" y="130" width="244" height="42" rx="7" class="sub" />
  <text x="60" y="148" class="label">Platform Adapters</text>
  <text x="60" y="163" class="body">macOS, Windows 10/11, Linux X11/Wayland</text>

  <rect x="308" y="130" width="244" height="42" rx="7" class="sub" />
  <text x="320" y="148" class="label">OS Keyring &amp; Capabilities</text>
  <text x="320" y="163" class="body">Keychain, Credential Manager, Secret Service</text>

  <rect x="568" y="130" width="244" height="42" rx="7" class="sub" />
  <text x="580" y="148" class="label">Window Material &amp; Controls</text>
  <text x="580" y="163" class="body">Vibrancy, Mica/Acrylic, Tray, Global Shortcut</text>

  <rect x="828" y="130" width="244" height="42" rx="7" class="sub" />
  <text x="840" y="148" class="label">Engine Lifecycle Manager</text>
  <text x="840" y="163" class="body">Bundled Sidecar Binary or Dev .venv Spawn</text>

  <!-- Connector 1 -> 2 -->
  <line x1="560" y1="184" x2="560" y2="216" class="arrow" marker-end="url(#ah)" />
  <text x="572" y="204" class="mono">Tauri IPC (Bearer Token, Native Dialogs, OS Events)</text>

  <!-- Layer 2: Frontend UI -->
  <rect x="32" y="220" width="1056" height="92" rx="10" class="layer" />
  <text x="48" y="244" class="heading">2. Omni Glass Workspace UI | React 19 + TypeScript + Vite</text>
  <text x="48" y="260" class="mono">apps/desktop/src  |  packages/shared-schemas (Zod)</text>

  <rect x="48" y="270" width="328" height="30" rx="6" class="sub" />
  <text x="60" y="289" class="body">Home • Operator • Live Workspace • Activity</text>

  <rect x="392" y="270" width="328" height="30" rx="6" class="sub" />
  <text x="404" y="289" class="body">Workflow Studio (DAG) • Teach Mode • Models • Settings</text>

  <rect x="736" y="270" width="336" height="30" rx="6" class="accent-box" />
  <text x="748" y="289" class="label">Top-Layer Overlays: Command Palette • Approval • Stop</text>

  <!-- Connector 2 -> 3 -->
  <line x1="560" y1="312" x2="560" y2="344" class="arrow" marker-end="url(#ah)" />
  <text x="572" y="332" class="mono">HTTP + SSE on 127.0.0.1:17420 (Authorization: Bearer &lt;token&gt;)</text>

  <!-- Layer 3: Python Operator Engine -->
  <rect x="32" y="348" width="732" height="180" rx="10" class="layer" />
  <text x="48" y="372" class="heading">3. Local Operator Engine | Python 3.12 + FastAPI + Pydantic</text>
  <text x="48" y="388" class="mono">backend/omnidesk_engine</text>

  <rect x="48" y="400" width="224" height="54" rx="7" class="sub" />
  <text x="60" y="418" class="label">TaskPlanner &amp; Orchestrator</text>
  <text x="60" y="433" class="body">JSON planning, async queue,</text>
  <text x="60" y="446" class="body">pause/resume, Emergency Stop</text>

  <rect x="286" y="400" width="224" height="54" rx="7" class="accent-box" />
  <text x="298" y="418" class="label">Security Policy &amp; Journal</text>
  <text x="298" y="433" class="body">6 risk tiers, path scoping,</text>
  <text x="298" y="446" class="body">SHA-256 undo rollback</text>

  <rect x="524" y="400" width="224" height="54" rx="7" class="sub" />
  <text x="536" y="418" class="label">Workflow &amp; Teach Engine</text>
  <text x="536" y="433" class="body">DAG runner, bounded loops,</text>
  <text x="536" y="446" class="body">redacted demonstration capture</text>

  <rect x="48" y="466" width="342" height="48" rx="7" class="sub" />
  <text x="60" y="484" class="label">Deterministic Automation Executors</text>
  <text x="60" y="499" class="body">Filesystem • OpenPyXL (.xlsx) • Playwright • Native Accessibility/Apps</text>

  <rect x="404" y="466" width="166" height="48" rx="7" class="sub" />
  <text x="416" y="484" class="label">SQLite Local Store</text>
  <text x="416" y="499" class="body">omnidesk.db (history, prefs)</text>

  <rect x="584" y="466" width="164" height="48" rx="7" class="sub" />
  <text x="596" y="484" class="label">MCP JSON-RPC 2.0</text>
  <text x="596" y="499" class="body">/mcp tool interoperability</text>

  <!-- Connector 3 -> 4 -->
  <line x1="764" y1="438" x2="796" y2="438" class="arrow" marker-end="url(#ah)" />

  <!-- Layer 4: AI Inference Backends -->
  <rect x="800" y="348" width="288" height="180" rx="10" class="layer" />
  <text x="816" y="372" class="heading">4. AI Inference Layer</text>
  <text x="816" y="388" class="mono">ProviderRegistry</text>

  <rect x="816" y="400" width="256" height="54" rx="7" class="badge-ok" />
  <text x="828" y="418" class="badge-ok-t">Local Runtime (Default Offline)</text>
  <text x="828" y="433" class="body">Ollama (127.0.0.1:11434) • qwen2.5:1.5b</text>
  <text x="828" y="446" class="body">Deterministic local fallback planner</text>

  <rect x="816" y="466" width="256" height="48" rx="7" class="sub" />
  <text x="828" y="484" class="label">Cloud Providers (Opt-In Consent)</text>
  <text x="828" y="499" class="body">Gemini • OpenAI • Claude • Compatible</text>
</svg>
